# ============================================================
# iPinYou RTB -> Yodo1 Ad-Business JD Full-Pipeline Demo Config
# Side project: runs fully on local mock data; no real DSP API is called
# ============================================================

data:
  seed: 20260903          # RNG seed for reproducible data generation
  days: 7                 # simulated log coverage in days
  fault_mode: full        # full=inject all teaching faults | none=pure healthy data | outage_only etc., see generator.PROFILE

quality:                  # Phase 1: data-quality check rule thresholds
  price_tolerance: 0      # allowed PayingPrice>BiddingPrice overshoot (cents)
  missing_parent_hard_ratio: 0.005   # orphan events (impression without bid) hard-error ratio
  orphan_bid_alert_ratio: 0.85       # share of bids with no impression, absolute alarm line; cross-window delta has its own line to avoid false alarms from normal win-rate shifts
  outlier_robust_z: 5.0              # within-campaign daily-outlier robust-z
  cross_unit_robust_z: 6.0           # cross-campaign outlier robust-z
  max_samples: 5                     # max sample rows returned per issue

kb:                       # Phase 2: fault-case knowledge base
  top_k: 3
  embedding: offline      # offline=local n-gram vectors (no key) | qwen=Qwen Embedding API
  dir: data/kb

llm:                      # Phase 3: Qwen inference (OpenAI-compatible / DashScope)
  model: glm-5.2
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY
  temperature: 0.1
  timeout: 90

agent:
  mode: auto              # auto=LLM when key exists else Mock | llm | mock
  max_steps: 10
  report_dir: reports

inspection:               # Phase 4: scheduled inspection workflow
  hours_window: 24
  spend_drop_flag: -0.5
  imp_drop_flag: -0.5
  ctr_surge_flag: 2.0
  ctr_drop_flag: -0.5
  watch_interval_sec: 3600

eval:                     # Phase 5: evaluation loop
  llm_judge: false        # if true and a key is configured, an LLM re-checks advice reasonableness
  report_dir: reports
  cases_dir: data/eval
